<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cadastro lavô tá novo</title>
    <link rel="stylesheet" href="index.css">
    <link rel="dados.js" href="dados.js">
    
</head>
<body>

    <div class="container">
    <div class="cadastro">
        <h1>Cadastro lavô tá novo</h1>
        <form action="processa_cadastro.php" method="POST">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" required><br>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required><br>
            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" name="telefone" required><br>
            <label for="endereco" >Endereço</label>
            <input type="text" id="endereco" name="endereco" required><br>
    
    </div>

        <div class="serviços">
            <h3>Tipo de cesto</h3>
            <label for="tipo_cesto">Tipo de cesto</label>
            <select id="tipo_cesto" name="tipo_cesto" required>
                <option value="" disabled selected>Selecione o tipo de cesto</option>
                <option value="cesto pequeno">Cesto pequeno</option>
                <option value="cesto médio">Cesto médio</option>
                <option value="cesto grande">Cesto grande</option>
                <option value="cesto familia">Cesto família</option>
            </select>
            </div>

        

            <div class="forma-pagamento">
                <h3>Forma de pagamento</h3>
            <select id="forma de pagamento" name="forma de pagamento" required>
                <option value="" disabled selected>Selecione a forma de pagamento</option>
                <option value="pix">Pix</option>
                <option value="cartão de crédito">Cartão de crédito</option>
                <option value="cartão de débito">Cartão de débito</option>
            </select>
            </div>


            
    
</body>
</html>
