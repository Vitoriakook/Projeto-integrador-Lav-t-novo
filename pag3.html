<body>
<div class="pagamento-cartao">
                <h1>Cadastro cartão</h1>
                <h2>Preencha os dados do cartão:</h2>

                <form action="processa_cartao.php" method="POST">

                    <div class="p1">
                    <label for="nome_cartao">Nome do titular:</label>
                    <input type="text" id="nome_cartao" name="nome_cartao" required>
                    </div>
                    
                    <div class="p2">
                    <label for="numero_cartao">Número do cartão:</label>
                    <input type="text" id="numero_cartao" name="numero_cartao" required>
                    </div>

                    <div class="p3">
                    <label for="validade_cartao">Validade do cartão:</label>
                    <input type="text" id="validade_cartao" name="validade_cartao" required>
                    </div>

                    <div class="p4">
                    <label for="cvv_cartao">CVV:</label>
                    <br> <input type="text" id="cvv_cartao" name="cvv_cartao" required> <br>
                    </div>
                    
                    <div class="p5">
                    <button type="submit">Cadastrar cartão</button>
                    </div>

                    </form>


</div>       <button onclick="window.location.href='pag1.html'">Voltar a página anterior</button>
