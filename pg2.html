<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro cartão</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="pag1.html">
    <link rel="script" href="dados.js">
</head>
<body>
    <div class="pagamento-pix">
        <h3>Pix copia e cola</h3>
        <p id="pix-codigo">0002014BR.GOV.BCB.PIX0114+559520.LAVÔTÁNOVO6009S14F</p>
        <button onclick="copiarPix()">Copiar código Pix</button>
        <script>
        function copiarPix() {
            const codigoPix = document.getElementById('pix-codigo').innerText;
            navigator.clipboard.writeText(codigoPix).then(function() {
                alert('Código Pix copiado!');
            }, function() {
                alert('Falha ao copiar o código Pix.');
            });
        }
        </script>
</div>
       <button onclick="window.location.href='pag1.html'">Voltar a página de cadastro</button>
       <button finalizar onclick="window.location.href='desing.html'">finalizar pedido</button>
 


    
</body>
</html>
